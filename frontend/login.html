<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Green Nepal | Login</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<section class="login-page">

<div class="login-box">

<h1>🌿 Green Nepal</h1>

<p>
Welcome Back
</p>

<form id="loginForm">

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<i class="fa-solid fa-eye" id="togglePassword"></i>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">
Forgot Password?
</a>

</div>

<button type="submit">

Login

</button>

<div class="register">

Don't have an account?

<a href="signup.html">

Register

</a>

</div>

</form>

</div>

</section>

<script src="js/login.js"></script>

</body>

</html>
